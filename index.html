<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOBOTIQUE / Virtual Closet</title>
<style>*{box-sizing:border-box}body{margin:0;background:#100d17;color:#eee;font:13px Arial}main{max-width:560px;margin:auto;height:100dvh;display:flex;flex-direction:column;border:1px solid #777}header{padding:14px;background:linear-gradient(#ddd,#777,#222);color:white;display:flex;justify-content:space-between;align-items:center}header b{font:bold italic 29px Georgia;text-shadow:2px 2px #111}small{letter-spacing:2px}#stage{flex:1;min-height:250px;position:relative;overflow:hidden}canvas{display:block;touch-action:none}#status{position:absolute;top:12px;left:12px;z-index:2;background:#1119;padding:8px}nav,footer{padding:10px;background:#201c29;border-top:1px solid #777}button,a{background:linear-gradient(#b9b9bd,#55545d);color:white;border:1px solid #ccc;padding:10px;font: bold 12px Arial;cursor:pointer;text-decoration:none}nav{display:flex;gap:8px;justify-content:center}.items{display:flex;gap:6px}.items button{flex:1;text-align:left;min-height:58px}.items button:disabled{opacity:.45}p{margin:8px 0;color:#bbb}footer{font-size:11px}button:focus-visible,a:focus-visible{outline:2px solid #ded3ff;outline-offset:3px}button[aria-pressed="true"]{background:linear-gradient(#8a7a9c,#3a2c48)}nav button{min-height:44px}main{min-height:600px}footer{padding-bottom:max(10px,env(safe-area-inset-bottom))}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<main>
<header>
<b>Bobotique ✦</b>
<small>VIRTUAL CLOSET<br>BUILD 0.2</small>
</header>
<div id="stage">
<div id="status" role="status" aria-live="polite">LOADING 3D CHARACTER…</div>
</div>
<nav>
<button id="left">↶ ROTATE</button>
<button id="zoom">＋ ZOOM</button>
<button id="reset">RESET</button>
<button id="spin" aria-pressed="false">AUTO</button>
<button id="photo" disabled>拍照</button>
</nav>
<footer>
<small>01 / FOUNDER · ARCHIVE WARDROBE</small>
<p>Current outfit · original 3D scan</p>
<div class="items">
<button disabled>HERVÉ LÉGER<br>COMING SOON</button>
<button disabled>DOLCE & GABBANA<br>COMING SOON</button>
<button disabled>MOSCHINO<br>COMING SOON</button>
</div>
<p>Drag to orbit · pinch to zoom · outfit assets pending</p>
<a href="https://bobotique.com" target="_blank">VISIT STORE ↗</a>
</footer>
</main>
<dialog id="photo-dialog" aria-labelledby="photo-title">
<h2 id="photo-title">造型照片</h2>
<p id="photo-message" role="status">正在生成照片…</p>
<img id="photo-preview" alt="当前角度的 BOBOTIQUE 角色照片" hidden>
<div class="photo-actions">
<a id="photo-download" hidden>下载 PNG</a>
<button id="photo-share" hidden>分享 / 保存到照片</button>
<button id="photo-close" autofocus>返回换装</button>
</div>
<p>iPhone 可通过分享菜单保存，也可长按照片保存。照片仅在本机生成。</p>
</dialog>
<style>
nav{flex-wrap:wrap}button:disabled{opacity:.45;cursor:default}
#photo{background:linear-gradient(#d9cce9,#645370)}
#photo-dialog{width:min(92vw,480px);max-height:90dvh;overflow:auto;padding:20px;color:#eee;background:#21192c;border:1px solid #aaa;box-shadow:0 16px 70px #0009}
#photo-dialog::backdrop{background:#08060dcc}
#photo-dialog h2{font:italic 24px Georgia;margin:0 0 12px}
#photo-dialog p{font-size:14px;line-height:1.5}
#photo-preview{display:block;max-width:100%;max-height:58dvh;object-fit:contain;margin:12px auto;background:#100d17}
#photo-preview[hidden],.photo-actions [hidden]{display:none}
.photo-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.photo-actions button,.photo-actions a{min-height:44px;font-size:14px;display:inline-flex;align-items:center}
</style>
<script type="module" src="./src/app.js">
</script>
</body>
</html>
